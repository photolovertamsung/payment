<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Polaroid Tamsung | โอนเงิน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stripe-a: #fff6f9;
    --stripe-b: #ffd9e7;
    --cream: #fffaf2;
    --card-border: #2b2620;
    --ink: #2b2620;
    --ink-soft: #6b5f57;
    --pink: #ffb8d2;
    --pink-deep: #ff8fb8;
    --blue: #bfe1ee;
    --butter: #fdecac;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100dvh;
    font-family: "Mali", "Helvetica Neue", sans-serif;
    color: var(--ink);
    background-color: var(--stripe-a);
    background-image: repeating-linear-gradient(
      90deg,
      var(--stripe-a) 0px,
      var(--stripe-a) 22px,
      var(--stripe-b) 22px,
      var(--stripe-b) 44px
    );
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;
    -webkit-font-smoothing: antialiased;
  }

  .board {
    width: 100%;
    max-width: 380px;
    background: var(--cream);
    border: 3px solid var(--card-border);
    border-radius: 22px;
    box-shadow: 6px 6px 0 rgba(43,38,32,0.85);
    padding: 30px 22px 24px;
    position: relative;
    animation: popIn 0.5s ease both;
    text-align: center;
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .tag {
    position: absolute;
    top: -16px;
    left: 24px;
    background: var(--butter);
    border: 2.5px solid var(--card-border);
    border-radius: 8px;
    padding: 5px 14px;
    font-family: "Baloo Thambi 2", "Mali", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    transform: rotate(-4deg);
    box-shadow: 2px 3px 0 rgba(43,38,32,0.9);
  }

  h1 {
    font-family: "Baloo Thambi 2", sans-serif;
    font-size: 21px;
    font-weight: 800;
    margin: 6px 0 4px;
    color: var(--ink);
  }

  .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 500;
    margin-bottom: 20px;
  }

  .qr-frame {
    background: #ffffff;
    border: 2.5px solid var(--card-border);
    border-radius: 16px;
    padding: 14px;
    display: inline-block;
    box-shadow: 3px 4px 0 rgba(43,38,32,0.9);
    margin-bottom: 18px;
  }

  .qr-img {
    width: 220px;
    max-width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    cursor: zoom-in;
  }

  .qr-hint {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 10px;
    font-weight: 500;
  }

  .shop-name {
    font-family: "Baloo Thambi 2", sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .shop-code {
    font-size: 13.5px;
    color: var(--ink-soft);
    font-weight: 500;
    margin-bottom: 14px;
  }

  .badge {
    display: inline-block;
    background: var(--pink);
    border: 2.5px solid var(--card-border);
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    box-shadow: 2px 3px 0 rgba(43,38,32,0.9);
  }

  /* LIGHTBOX */
  .lb {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(43,38,32,0.9);
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .lb.open { display: flex; }
  .lb-img {
    max-width: 100%;
    max-height: 85vh;
    border-radius: 16px;
    object-fit: contain;
    border: 3px solid #fff;
  }
  .lb-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 38px;
    height: 38px;
    background: var(--butter);
    border: 2.5px solid var(--card-border);
    border-radius: 50%;
    color: var(--ink);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .board { animation: none !important; }
  }
</style>
</head>
<body>

  <div class="board">
    <div class="tag">โอนเงิน 💸</div>

    <h1>PromptPay · รับทุกธนาคาร</h1>
    <p class="subtitle">สแกน QR ด้านล่างได้เลยค่ะ</p>

    <div class="qr-frame">
      <img class="qr-img" src="https://i.ibb.co/QF53CMTG/image.png" alt="QR PromptPay Polaroid Tamsung" onclick="openQr()">
    </div>

    <p class="shop-name">โพลาลอยด์ตามสั่ง</p>
    <p class="shop-code">รหัสร้านค้า: 014000003163128</p>

    <div class="badge">Accept all banks · รับเงินได้จากทุกธนาคาร</div>

    <p class="qr-hint">กดรูปเพื่อดูแบบเต็มจอได้นะคะ</p>
  </div>

  <div id="lb" class="lb" onclick="closeQr()">
    <img class="lb-img" src="https://i.ibb.co/QF53CMTG/image.png" alt="QR Code เต็มจอ">
    <button class="lb-close" onclick="closeQr()">✕</button>
  </div>

<script>
function openQr(){
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeQr(){
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeQr(); });
</script>
</body>
</html>
